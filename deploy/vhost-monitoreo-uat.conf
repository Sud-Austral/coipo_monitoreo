# Vhost de Nginx en vm3 (172.31.2.42).
# Destino: /etc/nginx/sites-available/monitoreo-uat.conf
#
# Sin 'default_server' ni '_' en server_name: en vm3 eso ya lo tiene
# tv-uat.conaf.cl.conf, y un segundo default_server hace fallar 'nginx -t' con
# "duplicate default server".
#
# Reemplazar 8000 por el APP_PORT asignado, que debe coincidir con el del
# /opt/apps/coipo_monitoreo/.env. Si no coinciden, Nginx devuelve 502.

server {
    listen 80;
    server_name monitoreo-uat.conaf.cl;

    access_log /var/log/nginx/monitoreo-uat.access.log;
    error_log  /var/log/nginx/monitoreo-uat.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
