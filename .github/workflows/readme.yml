name: Run README Maintainer

on:
  push:
    branches:
      - main

    paths-ignore:
      # Editar este archivo no debe disparar una regeneracion del README.
      # Sin esta linea, repuntar el stub en la flota generaria una ejecucion
      # y un pull request por cada repositorio tocado.
      - '.github/workflows/readme.yml'

  workflow_dispatch:
    inputs:
      insumos:
        description: Reconstruir insumos/ desde el codigo
        type: boolean
        required: false
        default: false

jobs:
  call-readme-generator:
    # Referencia fija: main es rama de trabajo del hub, no produccion.
    uses: Sud-Austral/coipo_aireadme/.github/workflows/generate-readme.yml@v1

    with:
      # La misma version, declarada tambien como entrada.
      #
      # El `uses:` de arriba solo fija el archivo YAML del workflow. El
      # codigo Python se descarga dentro con actions/checkout, y sin esta
      # entrada ese checkout baja la rama por defecto del hub: el tag
      # congelaria el workflow mientras el motor seguiria viniendo de main.
      #
      # Las dos referencias tienen que coincidir. auditar_workflows.py lo
      # comprueba en toda la flota.
      engine_ref: v1

      # Solo cuando se lanza a mano pidiendolo. Un push nunca lo dispara.
      insumos: ${{ inputs.insumos || false }}
