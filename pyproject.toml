[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coipo-monitoreo"
version = "1.0.0"
description = "Monitoreo de disponibilidad de las aplicaciones web de CONAF: distingue fallas de DNS, de proxy y de contenido"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "dnspython>=2.6",
    "PyYAML>=6.0",
    "cryptography>=42",
    "pydantic>=2.7",
    "rich>=13.7",
]

[project.scripts]
coipo-monitoreo = "coipo_monitoreo.cli:main"

[tool.setuptools]
packages = ["coipo_monitoreo"]

# Instalar no es obligatorio: 'python -m coipo_monitoreo' funciona desde la carpeta del
# repositorio con solo las dependencias puestas. Esto existe para quien prefiera el
# comando corto en el PATH.

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
